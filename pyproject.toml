[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kavach"
version = "0.1.0"
description = "An environmental safety copilot for Delhi's outdoor workers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "mangum>=0.17",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "boto3>=1.34"]
aws = ["boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kavach = ["sample_data.json", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
