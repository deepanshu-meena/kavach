AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Kavach - environmental safety copilot (Lambda + HTTP API + DynamoDB + Bedrock + SNS). Free-tier friendly.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.12

Resources:
  KavachTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kavach-readings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kavach-take-cover-alerts

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: kavach.lambda_handler.api_handler
      Environment:
        Variables:
          KAVACH_TABLE_NAME: !Ref KavachTable
          AWS_REGION: !Ref AWS::Region
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KavachTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertTopic
      Events:
        AnyApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: kavach.lambda_handler.ingest_handler
      Environment:
        Variables:
          KAVACH_TABLE_NAME: !Ref KavachTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KavachTable
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
